<!doctype html>
<html><head><meta charset="utf-8"><meta name="referrer" content="no-referrer"></head>
<body><script>
  // Send the fragment directly to Streamlit; never place credentials in a query URL.
  const send = (type, fields = {}) => window.parent.postMessage(
    {isStreamlitMessage: true, type, ...fields}, "*");
  let delivered = false;
  window.addEventListener("message", event => {
    if (event.source !== window.parent || event.data.type !== "streamlit:render" || delivered) return;
    send("streamlit:setFrameHeight", {height: 0});
    try {
      const url = new URL(window.parent.location.href);
      const params = new URLSearchParams(url.hash.slice(1));
      const access = params.get("access_token");
      const refresh = params.get("refresh_token");
      const error = params.get("error_description") || params.get("error");
      if (!(access && refresh) && !error) return;
      delivered = true;
      url.hash = "";
      window.parent.history.replaceState(null, "", url.toString());
      send("streamlit:setComponentValue", {value: error ? {oauth_error: error} :
        {sb_access_token: access, sb_refresh_token: refresh}, dataType: "json"});
    } catch (error) {
      delivered = true;
      send("streamlit:setComponentValue", {value: {oauth_error:
        "The browser could not complete the sign-in callback. Please try again."}, dataType: "json"});
    }
  });
  send("streamlit:componentReady", {apiVersion: 1});
</script></body></html>
